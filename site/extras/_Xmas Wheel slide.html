<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Wheel</title>
<!-- Not in the playlist on its own (name starts with _). "Spin to Win [40s].html" sends the TVs here until 1 Jan 2027. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Yellowtail&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{--pine:#11242A;--holly:#477E93;--red:#C9553F;--gold:#F5E1BE;--cream:#FFF6E3;--ink:#11242A}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;display:flex;overflow:hidden;background:radial-gradient(ellipse at 28% 50%,#21454f 0,var(--pine) 62%)}
  #snow{position:absolute;inset:0;width:1920px;height:1080px;z-index:0}
  .foliage{position:absolute;width:420px;height:420px;z-index:0}
  .foliage.tl{left:-90px;top:-70px}.foliage.br{right:-90px;bottom:-80px;transform:rotate(180deg)}.foliage.tr{right:-80px;top:-60px;transform:scaleX(-1);opacity:.7}.foliage.bl{left:-100px;bottom:-90px;transform:rotate(-90deg);opacity:.7}
  .left{position:relative;width:1000px;height:1080px;z-index:1}
  .wheelbox{position:absolute;left:120px;top:110px;width:800px;height:800px}
  .wheelbox svg{width:100%;height:100%;filter:drop-shadow(0 24px 40px rgba(0,0,0,.5))}
  #disc{transform-origin:50% 50%}
  .pointer{position:absolute;left:50%;top:-30px;margin-left:-44px;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-top:96px solid var(--red);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));z-index:2}
  .hub{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:#fff url("../omb/twm-logo-black.png") center/70% no-repeat;border:14px solid var(--red);box-shadow:0 0 0 6px #477E93;z-index:2}
  .bulbs circle{animation:tw 1.1s ease-in-out infinite alternate}
  .bulbs circle:nth-child(odd){animation-delay:.55s}
  @keyframes tw{from{opacity:.3}to{opacity:1}}
  .callout{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.2);opacity:0;z-index:3;text-align:center;transition:all .5s cubic-bezier(.3,1.5,.5,1)}
  .callout.on{opacity:1;transform:translateX(-50%) scale(1)}
  .callout div{display:inline-block;padding:22px 46px;background:var(--red);border:8px solid var(--cream);border-radius:30px;color:var(--cream);font:120px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;box-shadow:0 20px 50px rgba(0,0,0,.6);white-space:nowrap}
  .right{position:relative;z-index:1;width:920px;padding:70px 70px 0 10px;box-sizing:border-box;color:var(--cream)}
  .kicker{display:flex;gap:26px;align-items:center}.kicker img{height:84px;width:84px;border-radius:50%;background:#fff;padding:8px;object-fit:contain}
  h1{margin:10px 0 0;white-space:nowrap;font:128px/1.15 Yellowtail,cursive;font-weight:400;color:var(--gold)}
  .ed{font:600 30px/1.3 Inter,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .every{display:inline-block;margin:26px 0 0;padding:14px 32px;background:var(--red);border-radius:999px;font:700 38px/1.1 Inter,sans-serif;letter-spacing:.04em;color:var(--cream)}
  .prize{margin:22px 0 0;font:800 46px/1.2 Inter,sans-serif}
  .prize b{color:#fff}
  .row{display:flex;align-items:center;gap:40px;margin-top:34px}
  #qr{flex:none;width:250px;height:250px;padding:20px;background:#fff;border-radius:24px;box-shadow:0 0 0 8px var(--red)}
  #qr svg{width:100%;height:100%;display:block}
  .scan{font:100px/.9 'Bebas Neue',Impact,sans-serif;color:#fff}
  .scan small{display:block;margin-top:14px;font:700 30px/1.3 Inter,sans-serif;color:var(--cream)}
  .foot{position:absolute;z-index:1;left:120px;width:800px;top:990px;text-align:left;font:500 24px/1.4 Inter,sans-serif;color:rgba(255,246,227,.75)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="snow" width="1920" height="1080"></canvas>
  <svg class="foliage tl" viewBox="0 0 220 220" aria-hidden="true"><g fill="#477E93"><path d="M10 20c40 0 70 20 80 60-40 0-70-20-80-60z"/><path d="M0 90c35-10 70 0 90 30-35 10-70 0-90-30z"/><path d="M60 0c20 30 20 65 0 95-20-30-20-65 0-95z" transform="translate(40 10) rotate(30 60 50)"/><path d="M10 150c30-20 65-20 90 5-30 20-65 20-90-5z" opacity=".8"/><path d="M120 10c25 15 35 45 25 75-25-15-35-45-25-75z" opacity=".7"/></g><g fill="#C9553F"><circle cx="96" cy="78" r="6"/><circle cx="108" cy="92" r="5"/><circle cx="40" cy="128" r="5"/><circle cx="150" cy="40" r="5"/><circle cx="100" cy="150" r="6"/></g><path fill="#F5E1BE" d="M170 120l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/></svg><svg class="foliage br" viewBox="0 0 220 220" aria-hidden="true"><g fill="#477E93"><path d="M10 20c40 0 70 20 80 60-40 0-70-20-80-60z"/><path d="M0 90c35-10 70 0 90 30-35 10-70 0-90-30z"/><path d="M60 0c20 30 20 65 0 95-20-30-20-65 0-95z" transform="translate(40 10) rotate(30 60 50)"/><path d="M10 150c30-20 65-20 90 5-30 20-65 20-90-5z" opacity=".8"/><path d="M120 10c25 15 35 45 25 75-25-15-35-45-25-75z" opacity=".7"/></g><g fill="#C9553F"><circle cx="96" cy="78" r="6"/><circle cx="108" cy="92" r="5"/><circle cx="40" cy="128" r="5"/><circle cx="150" cy="40" r="5"/><circle cx="100" cy="150" r="6"/></g><path fill="#F5E1BE" d="M170 120l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/></svg><svg class="foliage tr" viewBox="0 0 220 220" aria-hidden="true"><g fill="#477E93"><path d="M10 20c40 0 70 20 80 60-40 0-70-20-80-60z"/><path d="M0 90c35-10 70 0 90 30-35 10-70 0-90-30z"/><path d="M60 0c20 30 20 65 0 95-20-30-20-65 0-95z" transform="translate(40 10) rotate(30 60 50)"/><path d="M10 150c30-20 65-20 90 5-30 20-65 20-90-5z" opacity=".8"/><path d="M120 10c25 15 35 45 25 75-25-15-35-45-25-75z" opacity=".7"/></g><g fill="#C9553F"><circle cx="96" cy="78" r="6"/><circle cx="108" cy="92" r="5"/><circle cx="40" cy="128" r="5"/><circle cx="150" cy="40" r="5"/><circle cx="100" cy="150" r="6"/></g><path fill="#F5E1BE" d="M170 120l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/></svg><svg class="foliage bl" viewBox="0 0 220 220" aria-hidden="true"><g fill="#477E93"><path d="M10 20c40 0 70 20 80 60-40 0-70-20-80-60z"/><path d="M0 90c35-10 70 0 90 30-35 10-70 0-90-30z"/><path d="M60 0c20 30 20 65 0 95-20-30-20-65 0-95z" transform="translate(40 10) rotate(30 60 50)"/><path d="M10 150c30-20 65-20 90 5-30 20-65 20-90-5z" opacity=".8"/><path d="M120 10c25 15 35 45 25 75-25-15-35-45-25-75z" opacity=".7"/></g><g fill="#C9553F"><circle cx="96" cy="78" r="6"/><circle cx="108" cy="92" r="5"/><circle cx="40" cy="128" r="5"/><circle cx="150" cy="40" r="5"/><circle cx="100" cy="150" r="6"/></g><path fill="#F5E1BE" d="M170 120l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/></svg>
  <div class="left">
    <div class="wheelbox"><div class="pointer"></div><svg viewBox="0 0 400 400"><g id="disc"></g></svg><div class="hub"></div></div>
    <div class="callout" id="callout"><div>£10 OFF FOOD</div></div>
  </div>
  <div class="right">
    <div class="kicker"><img src="../omb/twm-logo-black.png" alt="Three Wise Monkeys"><img src="https://othermonkeybrewing.com/wp-content/uploads/2025/09/OMB-Black-Logo.png" alt="Other Monkey Brewing" onerror="this.remove()"></div>
    <h1>Spin the Wheel</h1>
    <div class="ed">Christmas edition</div>
    <div class="every">Every spin wins</div>
    <div class="prize"><b>£10 off your food bill</b><br>in January</div>
    <div class="row">
      <div id="qr"></div>
      <div class="scan">Scan to spin<small>Join Monkey Points with your mobile and email. Your voucher lands in your inbox.</small></div>
    </div>
  </div>
<div class="foot">One spin per guest until 31 Dec. Use 1 to 31 Jan 2027 on a bill of £15 or more. Over 18s. Terms on the page.</div>
</div>
<script>
(function () {
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById("stage").style.transform = "scale(" + s + ")"; }
  addEventListener("resize", fit); fit();

  // Which venue's TV is this? Ipswich repo = ips, otherwise Colchester. ?v= overrides.
  var v = new URLSearchParams(location.search).get("v") || (/ipswich/i.test(location.pathname) ? "ips" : "col");
  var url = "https://twmlive-art.github.io/twm-screens/xmas/?v=" + v;
  try { var q = qrcode(0, "M"); q.addData(url); q.make(); document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  catch (e) { document.getElementById("qr").textContent = url; }

  // wheel
  var g = document.getElementById("disc"), ns = "http://www.w3.org/2000/svg", n = 8, r = 192, cx = 200, cy = 200, st = 2 * Math.PI / n;
  function el(t, a) { var e = document.createElementNS(ns, t); for (var k in a) e.setAttribute(k, a[k]); return e; }
  g.appendChild(el("circle", { cx: cx, cy: cy, r: 198, fill: "#3E7286", stroke: "#C9553F", "stroke-width": 2 }));
  for (var i = 0; i < n; i++) {
    var a0 = i * st - Math.PI / 2, a1 = a0 + st, mid = (a0 + a1) / 2, tx = cx + 132 * Math.cos(mid), ty = cy + 132 * Math.sin(mid);
    g.appendChild(el("path", { d: "M200 200L" + (cx + r * Math.cos(a0)) + " " + (cy + r * Math.sin(a0)) + "A192 192 0 0 1 " + (cx + r * Math.cos(a1)) + " " + (cy + r * Math.sin(a1)) + "Z", fill: i % 2 ? "#477E93" : "#C9553F", stroke: "#FFF6E3", "stroke-width": 2 }));
    var t = el("text", { x: tx, y: ty, transform: "rotate(" + (mid * 180 / Math.PI + 90) + " " + tx + " " + ty + ")", "text-anchor": "middle", "font-family": "'Bebas Neue',Impact,sans-serif", fill: "#FFF6E3" });
    var s1 = el("tspan", { x: tx, "font-size": 40, fill: "#FFF6E3" }); s1.textContent = "£10"; t.appendChild(s1);
    var s2 = el("tspan", { x: tx, dy: 26, "font-size": 22 }); s2.textContent = "OFF FOOD"; t.appendChild(s2);
    g.appendChild(t);
  }
  var b = el("g", { "class": "bulbs" });
  for (var k = 0; k < 24; k++) { var an = k * Math.PI / 12; b.appendChild(el("circle", { cx: cx + 195 * Math.cos(an), cy: cy + 195 * Math.sin(an), r: 4.5, fill: "#F5E1BE" })); }
  g.appendChild(b);

  // loop: spin 6s, show the prize 3s, repeat
  var rot = 0, co = document.getElementById("callout");
  function go() {
    co.classList.remove("on");
    rot += 360 * 4 + 22.5 + 45 * Math.floor(Math.random() * 8) - (rot % 45);
    g.style.transition = "transform 6s cubic-bezier(.12,.62,.08,1)";
    g.style.transform = "rotate(" + rot + "deg)";
    setTimeout(function () { co.classList.add("on"); }, 6100);
    setTimeout(go, 9500);
  }
  setTimeout(go, 800);

  // snow
  var c = document.getElementById("snow").getContext("2d"), f = [];
  for (var j = 0; j < 40; j++) f.push({ x: Math.random() * 1920, y: Math.random() * 1080, r: 1.5 + Math.random() * 4, s: .5 + Math.random() * 1.4, d: Math.random() * 6 });
  (function frame(t) {
    c.clearRect(0, 0, 1920, 1080);
    f.forEach(function (p) { var a = .2 + .8 * Math.abs(Math.sin(t / 900 + p.d)), r = p.r * 3; c.fillStyle = "rgba(245,225,190," + a + ")"; c.beginPath(); c.moveTo(p.x, p.y - r); c.lineTo(p.x + r * .25, p.y - r * .25); c.lineTo(p.x + r, p.y); c.lineTo(p.x + r * .25, p.y + r * .25); c.lineTo(p.x, p.y + r); c.lineTo(p.x - r * .25, p.y + r * .25); c.lineTo(p.x - r, p.y); c.lineTo(p.x - r * .25, p.y - r * .25); c.closePath(); c.fill(); });
    requestAnimationFrame(frame);
  })(0);
})();
</script>
</body>
</html>
