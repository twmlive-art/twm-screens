<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMB Core 4</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Beers come from ../omb/beers.json. Timeline: title 4s, each beer 6.5s, lineup 6s = 36s. */
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141414;font-family:Inter,system-ui,sans-serif;color:#fff}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:#141414}
  .card{position:absolute;inset:0;opacity:0;transition:opacity .5s}
  .card.on{opacity:1}

  /* title + lineup cards */
  .centre{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .badge{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:22px;padding:18px 34px}
  .badge img{display:block;height:110px;width:auto}
  .badge.small{border-radius:12px;padding:10px 18px}
  .badge.small img{height:52px}
  .h1{font-weight:900;font-size:112px;line-height:1;letter-spacing:-.02em;margin-top:44px}
  .h1.mid{font-size:72px;margin-top:0}
  .sub{margin-top:18px;font-weight:700;font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#F2B632}
  .stripe{position:absolute;left:0;bottom:0;width:100%;height:22px;display:flex}
  .stripe i{flex:1}

  /* beer card */
  .beer{display:flex;align-items:center}
  .beer .num{position:absolute;right:70px;top:54px;font-weight:900;font-size:120px;line-height:1;letter-spacing:-.02em;opacity:.95}
  .beer .num small{font-size:48px;font-weight:700;opacity:.6;margin-left:6px}
  .beer .range{position:absolute;right:76px;top:184px;font-weight:700;font-size:22px;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
  .glass{position:absolute;left:200px;top:120px;width:400px;height:840px}
  .glass svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
  .text{position:absolute;left:720px;top:0;width:1000px;height:1080px;display:flex;flex-direction:column;justify-content:center}
  .text .name{font-weight:900;font-size:124px;line-height:.98;letter-spacing:-.02em;transform:translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.2,.9,.3,1),opacity .6s}
  .text .name.long{font-size:98px}
  .text .pill{display:inline-block;align-self:flex-start;margin-top:30px;padding:12px 26px;border-radius:999px;font-weight:900;font-size:36px;color:#141414;transform:translateY(30px);opacity:0;transition:transform .6s .15s cubic-bezier(.2,.9,.3,1),opacity .6s .15s}
  .text .pill b{font-weight:900;margin-left:16px}
  .text .blurb{margin-top:40px;max-width:900px;font-weight:500;font-size:38px;line-height:1.35;opacity:0;transition:opacity .6s .9s}
  .text .vegan{margin-top:26px;font-weight:700;font-size:22px;letter-spacing:.24em;text-transform:uppercase;opacity:0;transition:opacity .6s 1.1s}
  .card.on .text .name,.card.on .text .pill{transform:none;opacity:1}
  .card.on .text .blurb{opacity:1}.card.on .text .vegan{opacity:.75}
  .beer .logo{position:absolute;right:70px;bottom:60px}

  /* lineup card */
  .row{display:flex;width:100%;height:640px}
  .row .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;transform:translateY(40px);opacity:0;transition:transform .5s,opacity .5s}
  .card.on .row .col{transform:none;opacity:1}
  .row .col .n{font-weight:900;font-size:52px;line-height:1.02;letter-spacing:-.01em}
  .row .col .s{margin-top:22px;font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase}
  .bottom{height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .bottom .foot{margin-top:18px;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:#F2B632}
  .bottom .badge{margin-top:40px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  var LOGO = "https://othermonkeybrewing.com/wp-content/uploads/2025/09/OMB-Black-Logo.png";
  var TITLE_S = 4, BEER_S = 6.5, END_S = 6;
  var stage = document.getElementById("stage");

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit); fit();

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function badge(small) { return '<div class="badge' + (small ? " small" : "") + '"><img src="' + LOGO + '" alt="Other Monkey Brewing"></div>'; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // A pint glass that fills up, like the original video: slim tumbler, thin pale outline,
  // head settling on top, bubbles rising, highlight down the left side.
  var GLASS = "M70 30 L350 30 L322 780 Q320 800 300 800 L120 800 Q100 800 98 780 Z";
  function glass(b, k) {
    var id = "g" + k;
    return '<svg viewBox="0 0 420 820">'
      + '<defs><clipPath id="' + id + '"><path d="' + GLASS + '"/></clipPath></defs>'
      + '<path d="' + GLASS + '" fill="rgba(255,255,255,.06)"/>'
      + '<g clip-path="url(#' + id + ')">'
      + '<rect x="0" y="820" width="420" height="820" fill="' + b.beer + '"><animate attributeName="y" from="820" to="130" dur="3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".25 .7 .3 1"/></rect>'
      + '<rect x="0" y="820" width="420" height="70" fill="' + b.head + '"><animate attributeName="y" from="820" to="60" dur="3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".25 .7 .3 1"/></rect>'
      + '<rect x="0" y="820" width="420" height="22" fill="rgba(0,0,0,.08)"><animate attributeName="y" from="820" to="130" dur="3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".25 .7 .3 1"/></rect>'
      + bubbles()
      + '</g>'
      + '<path d="' + GLASS + '" fill="none" stroke="#F3EBDD" stroke-width="7" stroke-linejoin="round"/>'
      + '<path d="M112 110 L96 690" stroke="rgba(255,255,255,.45)" stroke-width="12" stroke-linecap="round"/>'
      + '</svg>';
  }
  function bubbles() {
    var s = "";
    for (var i = 0; i < 26; i++) {
      var x = 118 + ((i * 47) % 186), r = 3 + (i % 4) * 1.5, d = 2.6 + (i % 5) * .55, b = ((i * .43) % 2.4);
      s += '<circle cx="' + x + '" cy="800" r="' + r + '" fill="rgba(255,255,255,.7)">'
        + '<animate attributeName="cy" from="800" to="150" dur="' + d + 's" begin="' + (2.2 + b) + 's" repeatCount="indefinite"/>'
        + '<animate attributeName="cx" values="' + x + ';' + (x + 6) + ';' + (x - 6) + ';' + x + '" dur="' + (d * .8) + 's" begin="' + (2.2 + b) + 's" repeatCount="indefinite"/>'
        + '<animate attributeName="opacity" values="0;.9;.9;0" dur="' + d + 's" begin="' + (2.2 + b) + 's" repeatCount="indefinite"/></circle>';
    }
    return s;
  }

  function build(cfg) {
    var beers = cfg.beers || [], cards = [];

    // 1. title
    var t = el("div", "card centre",
      badge() + '<div class="h1">' + esc(cfg.title || "The Core 4") + '</div><div class="sub">' + esc(cfg.subtitle || "") + '</div>'
      + '<div class="stripe">' + beers.map(function (b) { return '<i style="background:' + b.accent + '"></i>'; }).join("") + '</div>');
    t.style.background = "#141414";
    cards.push({ el: t, secs: TITLE_S });

    // 2. one card per beer
    beers.forEach(function (b, k) {
      var c = el("div", "card beer");
      c.style.background = b.bg;
      c.innerHTML =
        '<div class="num">' + pad(k + 1) + '<small>/ ' + pad(beers.length) + '</small></div>'
        + '<div class="range">OMB Core Range</div>'
        + '<div class="glass">' + glass(b, k) + '</div>'
        + '<div class="text">'
        + '<div class="name' + (String(b.name).length > 20 ? " long" : "") + '">' + esc(b.name) + '</div>'
        + '<div class="pill" style="background:' + b.accent + '">' + esc(b.style) + '<b>' + esc(b.abv) + '</b></div>'
        + '<div class="blurb">' + esc(b.blurb || "") + '</div>'
        + (b.vegan ? '<div class="vegan">Vegan</div>' : "")
        + '</div>'
        + '<div class="logo">' + badge(true) + '</div>';
      cards.push({ el: c, secs: BEER_S });
    });

    // 3. lineup
    var L = el("div", "card");
    L.style.background = "#141414";
    L.innerHTML = '<div class="row">' + beers.map(function (b, k) {
      return '<div class="col" style="background:' + b.bg + ';transition-delay:' + (k * .12) + 's"><div class="n">' + esc(b.name) + '</div><div class="s" style="color:' + b.accent + '">' + esc(b.style) + ' &nbsp;' + esc(b.abv) + '</div></div>';
    }).join("") + '</div>'
      + '<div class="bottom"><div class="h1 mid">' + esc(cfg.closing || "Ask at the bar") + '</div><div class="foot">' + esc(cfg.footer || "") + '</div>' + badge() + '</div>';
    cards.push({ el: L, secs: END_S });

    cards.forEach(function (c) { stage.appendChild(c.el); });

    // play through once, then loop (the player cuts away at the [36s] mark anyway)
    var i = 0;
    function showCard() {
      cards.forEach(function (c) { c.el.classList.remove("on"); });
      var c = cards[i % cards.length];
      // re-insert so the SVG fill animation restarts
      var fresh = c.el.cloneNode(true); c.el.parentNode.replaceChild(fresh, c.el); c.el = fresh;
      setTimeout(function () { fresh.classList.add("on"); }, 30);
      i++;
      setTimeout(showCard, c.secs * 1000);
    }
    showCard();
  }

  fetch("../omb/beers.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(build)
    .catch(function () {
      stage.innerHTML = '<div class="card centre on">' + badge() + '<div class="h1">The Core 4</div><div class="sub">Brewed in Colchester</div></div>';
    });
})();
</script>
</body>
</html>
